AWSTemplateFormatVersion: '2010-09-09'
Description: >
  MCPfarm ECS service (self-host). Creates the Fargate cluster, ALB,
  target group, task definition (arm64), service, autoscaling, log
  group, and Route53 A-alias. Networking is consumed via parameters
  from the pinkconnect-networking stack (MCPfarm shares the same VPC
  as PinkConnect). Tools-call credential lookups go to PinkConnect at
  the CONNECT_URL parameter — there is no Pinkfish-hosted service in
  the request path.

Parameters:

  EnvironmentName:
    Type: String
    Default: mcpfarm

  # ---- Network (outputs of pinkconnect-networking stack) ----
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PublicSubnetBId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetAId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetBId:
    Type: AWS::EC2::Subnet::Id

  # ---- Image + URLs ----
  ContainerImage:
    Type: String
    Description: ECR image URI for the Pinkfish MCP server image (arm64 only).

  ConnectUrl:
    Type: String
    Description: >
      Customer's PinkConnect base URL (e.g. https://connect.example.com)
      — the MCP server's tool handlers call this to fetch per-connection
      credentials. Typically the PublicUrl output of the
      pinkconnect-ecs stack. There must be no Pinkfish-hosted endpoint
      in this value.

  CustomDomainName:
    Type: String
    Description: >
      Customer-facing DNS name for the MCPfarm ALB
      (e.g. mcp.example.com). Must be covered by CertificateArn.
  Route53HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CertificateArn:
    Type: String

  # ---- Secrets prefix ----
  # MCPfarm reads its secrets from the same /pinkconnect/* SSM namespace
  # PinkConnect uses (JWT signing key and Upstash creds are shared
  # operational secrets). Override only if you want MCPfarm to consume
  # a separate namespace.
  SsmPrefix:
    Type: String
    Default: /pinkconnect

  # ---- Capacity ----
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    Description: >
      Steady-state task count. Default 1 for smoke deploys; set to 2+
      for production (one task per AZ minimum).
  MaxCount:
    Type: Number
    Default: 5
    MinValue: 1
  TaskCpu:
    Type: String
    Default: '1024'
    AllowedValues: [ '512', '1024', '2048', '4096' ]
  TaskMemory:
    Type: String
    Default: '2048'

  # ---- Container port + health ----
  ContainerPort:
    Type: Number
    Default: 3020
    Description: >
      Port the MCP server listens on inside the container. The standard
      Pinkfish MCP image listens on 3020; override only if you've baked
      a custom image with a different PORT default.

  HealthCheckPath:
    Type: String
    Default: /
    Description: >
      ALB health-check path. The Pinkfish MCP image does not currently
      expose a dedicated readiness endpoint, so the default probes `/`
      and the `HealthCheckMatcher` is permissive (any non-5xx counts as
      healthy). Override both this parameter and `HealthCheckMatcher`
      together if a custom image surfaces a real readiness endpoint.

  HealthCheckMatcher:
    Type: String
    Default: '200-499'
    Description: >
      HTTP codes that mark the target healthy. Default `200-499` lets
      the catch-all route's natural 404 / unauthorized responses count
      as "container is alive" without requiring a dedicated /health
      endpoint in the image. Switch to `200` only when paired with a
      real readiness path.

  # ---- Hardening flags (mirror of pinkconnect-ecs.yaml) ----
  InternalAlb:
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'false'
    Description: >
      'true' makes the ALB internal-only (private subnets, no internet
      ingress). Use when MCPfarm is reached over VPN / PrivateLink /
      a corporate network only. Default 'false' = internet-facing.

  KmsKeyArn:
    Type: String
    Default: ''
    Description: >
      Customer-managed KMS CMK ARN. When set, the execution role's
      kms:Decrypt is scoped to this exact key. When empty (default),
      the execution role's kms:Decrypt uses Resource: '*' constrained
      by a kms:ViaService=ssm.<region>.amazonaws.com condition.

  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [ 1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365, 400, 545, 731, 1827, 3653 ]
    Description: >
      CloudWatch Logs retention in days. Default 90 covers most SOC2 /
      ISO27001 thresholds. Bump to 365+ for HIPAA / SOX / FedRAMP.

  WebAclArn:
    Type: String
    Default: ''
    Description: >
      Optional AWS WAFv2 Web ACL ARN to associate with the ALB. Empty
      (default) = no WAF. Recommended for production.

  CreateDnsRecord:
    Type: String
    AllowedValues: [ 'true', 'false' ]
    Default: 'true'
    Description: >
      'true' (default) creates a Route53 A-alias for CustomDomainName
      pointing at the ALB.

Conditions:
  InternalAlbCond: !Equals [ !Ref InternalAlb, 'true' ]
  HasCustomKmsKeyCond: !Not [ !Equals [ !Ref KmsKeyArn, '' ] ]
  HasWebAclCond: !Not [ !Equals [ !Ref WebAclArn, '' ] ]
  CreateDnsRecordCond: !Equals [ !Ref CreateDnsRecord, 'true' ]

Resources:

  # ---------- Security groups ----------

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} ALB SG'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-alb-sg' }

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${EnvironmentName} task SG'
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: !Sub '${EnvironmentName}-task-sg' }

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort

  # ---------- Cluster ----------

  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${EnvironmentName}-cluster'
      ClusterSettings:
        - { Name: containerInsights, Value: enabled }

  # ---------- Load balancer ----------

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${EnvironmentName}-alb'
      Scheme: !If [ InternalAlbCond, internal, internet-facing ]
      Type: application
      Subnets: !If
        - InternalAlbCond
        - [ !Ref PrivateSubnetAId, !Ref PrivateSubnetBId ]
        - [ !Ref PublicSubnetAId, !Ref PublicSubnetBId ]
      SecurityGroups: [ !Ref AlbSecurityGroup ]

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${EnvironmentName}-tg'
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher: { HttpCode: !Ref HealthCheckMatcher }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '30' }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: HasWebAclCond
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !Ref WebAclArn

  # ---------- IAM ----------

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-exec-role'
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SsmAndKms
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SsmPrefix}/*'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !If
                  - HasCustomKmsKeyCond
                  - !Ref KmsKeyArn
                  - '*'
                Condition: !If
                  - HasCustomKmsKeyCond
                  - !Ref AWS::NoValue
                  - StringEquals:
                      kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'

  # MCPfarm does not write per-connection credentials (PinkConnect owns
  # that namespace). The task role is intentionally empty beyond the
  # baseline ECS assume-role policy — all upstream calls fan out via
  # CONNECT_URL through PinkConnect, which holds the AWS Secrets Manager
  # writer role.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-task-role'
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  # ---------- Logging ----------

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${EnvironmentName}'
      RetentionInDays: !Ref LogRetentionDays

  # ---------- Task definition ----------

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${EnvironmentName}-task'
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [ FARGATE ]
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: mcpfarm
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: !Ref ContainerPort }
            # CONNECT_URL is what makes the MCP server's tool handlers
            # route credentialed upstream calls through the customer's
            # own PinkConnect rather than a Pinkfish-hosted endpoint.
            - { Name: CONNECT_URL, Value: !Ref ConnectUrl }
            # API_URL is intentionally UNSET — that's the env-flag the
            # platform-side createServer() branches on to load MCP
            # definitions from the baked-in mcp-server-definitions/
            # filesystem catalog instead of fetching them from DDB
            # via a Pinkfish-hosted Go backend.
          Secrets:
            - Name: JWT_PUBLIC_KEY
              ValueFrom: !Sub '${SsmPrefix}/jwt-public-key'
            - Name: UPSTASH_RATELIMIT_REDIS_URL
              ValueFrom: !Sub '${SsmPrefix}/upstash-ratelimit-redis-url'
            - Name: UPSTASH_RATELIMIT_REDIS_TOKEN
              ValueFrom: !Sub '${SsmPrefix}/upstash-ratelimit-redis-token'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: mcpfarm

  # ---------- Service ----------

  Service:
    Type: AWS::ECS::Service
    DependsOn: [ HttpsListener ]
    Properties:
      ServiceName: !Sub '${EnvironmentName}-svc'
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !Ref PrivateSubnetAId
            - !Ref PrivateSubnetBId
          SecurityGroups: [ !Ref TaskSecurityGroup ]
      LoadBalancers:
        - ContainerName: mcpfarm
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 120

  # ---------- Autoscaling ----------

  AutoscalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: application-autoscaling.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceAutoscaleRole

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: !Ref MaxCount
      MinCapacity: !Ref DesiredCount
      ResourceId: !Sub 'service/${EcsCluster}/${Service.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !GetAtt AutoscalingRole.Arn

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${EnvironmentName}-cpu-scale'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 60
        ScaleOutCooldown: 30

  # ---------- DNS ----------

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecordCond
    Properties:
      HostedZoneId: !Ref Route53HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: false

Outputs:
  AlbDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  PublicUrl:
    Value: !Sub 'https://${CustomDomainName}'
  ClusterName:
    Value: !Ref EcsCluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
    Description: >
      MCPfarm task SG. MCPfarm makes outbound HTTPS to PinkConnect's
      ALB and to external vendor APIs (port 443); no special inbound
      authorization is needed beyond ALB->task ingress on the
      container port (already configured by this stack).
